spring.application.name=cartnova-backend
server.port=8080

# Database - never hardcode credentials; supply via environment variables.
# Defaults below match your existing DBConnection.java so local dev still works out of the box,
# but you should override DB_PASSWORD via env var rather than relying on the default.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/shopping_db}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:Akash}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# HikariCP connection pool (replaces the old single shared Connection object)
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2

# JWT
jwt.secret=${JWT_SECRET:change-this-to-a-long-random-secret-before-deploying-cartnova-2026}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# Don't leak stack traces to API responses
server.error.include-message=never
server.error.include-stacktrace=never

logging.level.com.shopping=INFO
